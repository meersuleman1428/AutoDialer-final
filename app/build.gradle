plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
  namespace 'com.itskills.pcdautodial'
  compileSdk 34
  defaultConfig { applicationId 'com.itskills.pcdautodial'; minSdk 24; targetSdk 34; versionCode 3; versionName '1.2' }
  signingConfigs { debug { storeFile file('pcd.keystore'); storePassword 'pcd12345'; keyAlias 'pcd'; keyPassword 'pcd12345' } }
